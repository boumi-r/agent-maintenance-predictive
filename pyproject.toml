[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-ai"
version = "0.1.0"
description = "Maintenance prédictive des moteurs électriques industriels"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.7",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "email-validator==2.3.0",
    "anthropic==2.8.0",
    "httpx==0.28.1",
    "PyJWT==2.15.1",
    "pwdlib[argon2]==0.3.1",
    "limits==5.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.coverage.run]
source = ["backend/app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caractères accentués / typographiques en français

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "S105", "S106"]
"backend/alembic/**" = ["N", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["app"]
plugins = ["pydantic.mypy"]
