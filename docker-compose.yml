# Développement local : API + PostgreSQL.  Usage : docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maintenance
      POSTGRES_PASSWORD: maintenance
      POSTGRES_DB: maintenance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance -d maintenance"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://maintenance:maintenance@db:5432/maintenance
      # Valeurs de développement uniquement ; .env ou Railway les remplacent en vrai.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-a-changer-dev-secret-a-changer}
      API_KEY_SALT: ${API_KEY_SALT:-dev-sel-a-changer}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
